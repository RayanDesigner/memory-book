<!doctype html>
<html lang="en" dir="ltr" data-theme="wedding">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rami & Fedaa · Our Memory Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,500&family=Great+Vibes&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(.2,.9,.3,1);--spring:cubic-bezier(.34,1.7,.5,1);--safe-b:env(safe-area-inset-bottom,0px);
  --script:"Great Vibes",cursive;--serif:"Cormorant Garamond",Georgia,serif;--sans:Jost,system-ui,sans-serif}
[data-theme=wedding]{--bg:#f4ece0;--paper:#fffdf9;--ink:#3d3530;--muted:#8b7f72;--accent:#b8955a;--accent2:#e9dcc3;--tape:rgba(233,220,195,.9);--hdr:#3d3530}
[data-theme=trips]{--bg:#1d2730;--paper:#f7f2e8;--ink:#22303a;--muted:#6f7d88;--accent:#ff9f43;--accent2:#ffd36b;--tape:rgba(255,211,107,.88);--hdr:#fff}
[data-theme=cafe]{--bg:#e6d5bd;--paper:#fbf6ee;--ink:#3e2a1e;--muted:#8a6f5a;--accent:#6b4226;--accent2:#c9a27e;--tape:rgba(201,162,126,.85);--hdr:#3e2a1e}
[data-theme=moments]{--bg:#fbeef0;--paper:#fffafa;--ink:#4a2f36;--muted:#a07a83;--accent:#d4687e;--accent2:#f7c6cf;--tape:rgba(247,198,207,.9);--hdr:#4a2f36}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);transition:background-color .6s}
[data-theme=wedding] body{background:radial-gradient(120% 70% at 50% -10%,#fffaf2 0,transparent 60%),radial-gradient(circle at 1px 1px,rgba(184,149,90,.13) 1px,transparent 1.6px) 0 0/22px 22px,#f4ece0}
[data-theme=trips] body{background:linear-gradient(180deg,#1b2530,#2c3946)}
[data-theme=cafe] body{background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 50%),#e6d5bd}
[data-theme=moments] body{background:radial-gradient(#f3cbd3 1px,transparent 1.6px) 0 0/18px 18px,#fbeef0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#amb{position:fixed;inset:0;z-index:0;pointer-events:none}
#wipe{position:fixed;inset:0;z-index:60;display:none;pointer-events:none}

/* ===== COVER ===== */
#cover{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#e7dfd2;cursor:pointer;transition:opacity .8s .7s}
#cover.gone{opacity:0;pointer-events:none}
.paper{position:relative;width:min(100vw,calc(100dvh * 9 / 16));aspect-ratio:9/16;container-type:inline-size;transform-origin:left center;transform:perspective(1800px) rotateY(0deg);
  transition:transform 1.4s cubic-bezier(.6,0,.2,1);box-shadow:0 30px 80px rgba(60,40,20,.22);overflow:hidden;animation:paperIn 1.2s var(--ease) both}
@keyframes paperIn{from{opacity:0;transform:perspective(1800px) translateY(18px) scale(.98)}}
#cover.open .paper{transform:perspective(1800px) rotateY(-100deg)}
.paper .frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.oval{position:absolute;left:27%;top:20.8%;width:45.5%;height:34.4%;border-radius:50%;overflow:hidden;background:#efe8dc}
.oval::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 3px 9px rgba(70,50,30,.38),inset 0 -1px 2px rgba(255,255,255,.7);pointer-events:none}
#coverPhoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;opacity:0;transform:scale(1.06);transition:opacity 1.4s,transform 6s var(--ease)}
#coverPhoto.ok{opacity:1;transform:scale(1)}
.ph-rose{position:absolute;left:24%;right:24%;top:28%;opacity:.5;filter:sepia(.25) saturate(.6)}
.ph-rose img{width:100%;height:auto;display:block}
.cv-text{position:absolute;left:0;right:0;top:69.5%;text-align:center;color:#6f6559}
.cv-text h1{font-family:var(--script);font-weight:400;font-size:11.5cqw;margin:0;line-height:1.1;white-space:nowrap;
  text-shadow:0 1px 0 rgba(255,255,255,.95),0 -1px 0 rgba(90,70,50,.18)}
.cv-text h1 b{font-weight:400;font-size:.8em;margin:0 .05em}
.cv-date{font-family:var(--serif);font-style:italic;font-size:3.9cqw;letter-spacing:.24em;margin:1.5cqw 0 0;min-height:1em;color:#7d7264}
#openBtn{margin-top:7cqw;background:transparent;color:#857867;font:500 2.9cqw/1 var(--sans);letter-spacing:.38em;padding:3.4cqw 7cqw 3.4cqw 7.4cqw;border:1px solid rgba(133,120,103,.45);border-radius:999px;
  text-shadow:0 1px 0 rgba(255,255,255,.9);animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{border-color:rgba(133,120,103,.85);box-shadow:0 0 0 6px rgba(133,120,103,.06)}}

/* ===== APP ===== */
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#app[hidden]{display:none}
.top{display:flex;align-items:center;gap:10px;padding:12px 18px 0;color:var(--hdr)}
.names{font-family:var(--script);font-size:34px;color:var(--hdr);text-align:left;line-height:1.1;white-space:nowrap}
.names i{font-style:normal;color:var(--accent);margin:0 4px;font-size:.8em}
.days{font-family:var(--serif);font-style:italic;font-size:15px;opacity:.8;flex:1;text-align:right;padding-right:4px}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 70%,transparent);color:var(--ink);flex:none}
.deco{height:62px;position:relative;margin:0 0 2px;overflow:hidden}
.book{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.book::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:grid;place-items:center;padding:14px 26px 18px}
.leaf{width:min(100%,420px);height:100%;max-height:660px;background:var(--paper);border-radius:6px 18px 18px 6px;position:relative;padding:18px 18px 20px;display:flex;flex-direction:column;will-change:transform;
  box-shadow:3px 3px 0 rgba(0,0,0,.05),6px 6px 0 rgba(0,0,0,.035),0 22px 44px rgba(0,0,0,.2)}
[data-theme=wedding] .leaf{background:radial-gradient(120% 80% at 50% 0%,#fffefb,#fdf8ef)}
[data-theme=wedding] .leaf::before{content:"";position:absolute;inset:9px;border:1px solid var(--accent2);border-radius:3px 12px 12px 3px;pointer-events:none}
[data-theme=wedding] .leaf::after{content:"";position:absolute;inset:13px;border:.5px solid rgba(184,149,90,.35);border-radius:2px 9px 9px 2px;pointer-events:none}
[data-theme=trips] .leaf{background:linear-gradient(rgba(34,48,58,.05) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,rgba(34,48,58,.05) 1px,transparent 1px) 0 0/22px 22px,var(--paper)}
[data-theme=cafe] .leaf{background:radial-gradient(circle at 14% 90%,transparent 30px,rgba(140,90,50,.13) 31px,rgba(140,90,50,.04) 35px,transparent 37px),var(--paper)}
[data-theme=moments] .leaf{background:radial-gradient(rgba(212,104,126,.12) 1px,transparent 1.6px) 0 0/16px 16px,var(--paper)}

.collage{position:relative;flex:1;min-height:0}
.pol{position:absolute;background:#fff;box-shadow:0 10px 22px rgba(0,0,0,.2);padding:0;transform:rotate(var(--r))}
.pol .ph{position:absolute;inset:8px 8px 30px 8px;overflow:hidden;background:#eee}
.pol img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .6s}
.pol img.ok{opacity:1}
.pol .ph{background:linear-gradient(110deg,#eee 30%,#f8f8f8 50%,#eee 70%) 0 0/300% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-150% 0}}
.tape{position:absolute;top:-10px;left:50%;width:70px;height:22px;margin-left:-35px;background:var(--tape);transform:rotate(-4deg);z-index:2;box-shadow:0 1px 2px rgba(0,0,0,.08);
  -webkit-mask:linear-gradient(90deg,transparent 0 2px,#000 2px calc(100% - 2px),transparent 0);mask:linear-gradient(90deg,transparent 0 2px,#000 2px calc(100% - 2px),transparent 0)}
[data-theme=wedding] .tape{width:14px;height:14px;margin-left:-7px;top:-5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#e8dcc6);transform:none;-webkit-mask:none;mask:none;box-shadow:0 2px 4px rgba(0,0,0,.2)}
[data-theme=wedding] .pol{background:#fffaf2;outline:1px solid var(--accent2);outline-offset:-5px}
.more{position:absolute;bottom:6px;right:6px;background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px;z-index:3}
.cap{padding-top:14px;text-align:center}
.cap h3{font-family:var(--serif);font-weight:700;font-size:28px;margin:0;line-height:1.15}
.cap .date{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.cap .note{font-family:var(--serif);font-style:italic;font-size:19px;margin:6px 0 0;line-height:1.35;color:var(--ink);opacity:.85;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kebab{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);z-index:5}

/* stickers: die-cut look */
.stk{position:absolute;z-index:4;pointer-events:none;transform:scale(0) rotate(var(--r));
  filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(0 5px 6px rgba(0,0,0,.22))}
[data-theme=wedding] .stk{filter:drop-shadow(0 6px 8px rgba(120,90,50,.25))}
.stk svg,.stk img{width:100%;height:auto;display:block;overflow:visible;animation:bob 4.5s ease-in-out infinite;animation-delay:var(--d)}
.garland img{width:100%;height:auto;display:block}
@keyframes bob{50%{transform:translateY(-4px) rotate(3deg)}}
.page .pol{opacity:0;transform:translateY(34px) rotate(calc(var(--r) - 10deg)) scale(.9)}
.page.in .pol{opacity:1;transform:rotate(var(--r));transition:opacity .5s var(--d),transform .8s var(--spring) var(--d)}
.page.in .stk{transform:scale(1) rotate(var(--r));transition:transform .7s var(--spring) calc(var(--d) + 350ms)}
.page .cap{opacity:0;transform:translateY(12px)}
.page.in .cap{opacity:1;transform:none;transition:.6s var(--ease) .3s}

/* chapter page */
.chap .leaf{align-items:center;justify-content:center;text-align:center}
.chap-art{position:relative;width:230px;height:200px;margin-bottom:8px}
.chap-art .stk{position:absolute}
.chap-art .a0{width:124px;left:53px;top:38px}
.chap-art .a1{width:80px;right:-6px;top:0}
.chap-art .a2{width:100px;left:-10px;bottom:-6px}
.chap-art .a3{width:66px;left:6px;top:4px}
.kick{margin:0;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);font-weight:600}
.chap h2{font-family:var(--serif);font-weight:700;font-size:40px;margin:6px 0 2px;line-height:1.05}
.chap .line{font-family:var(--script);font-size:28px;margin:4px 0 10px;color:var(--accent)}
.chap .count{font-weight:500;margin:4px 0 14px;letter-spacing:.04em}
.swipe{font-size:13px;letter-spacing:.08em;color:var(--muted);margin:0}
.swipe span{display:inline-block;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(8px)}}

.progress{height:3px;margin:0 34px 10px;background:color-mix(in srgb,var(--hdr) 15%,transparent);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .3s var(--ease)}
.tabs{position:relative;display:flex;margin:0 12px calc(10px + var(--safe-b));padding:6px;border-radius:22px;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.14)}
.tab{flex:1;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:11.5px;font-weight:500;letter-spacing:.02em;color:var(--muted);transition:color .3s}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}
.pill{position:absolute;top:6px;bottom:6px;left:0;border-radius:16px;background:color-mix(in srgb,var(--accent) 14%,transparent);transition:transform .5s var(--spring),width .5s var(--spring);z-index:1}
#fab{position:fixed;z-index:20;right:20px;bottom:calc(92px + var(--safe-b));width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;box-shadow:0 12px 26px rgba(0,0,0,.28);display:grid;place-items:center;transition:transform .3s var(--spring)}
#fab:active{transform:scale(.88) rotate(90deg)}
#fab svg{width:26px;height:26px}

/* deco strips */
.road{position:absolute;inset:0 18px}
.road i{position:absolute;left:0;right:0;bottom:10px;height:3px;background:repeating-linear-gradient(90deg,var(--accent2) 0 18px,transparent 18px 34px);animation:dash .6s linear infinite}
@keyframes dash{to{background-position:34px 0}}
.road .car{position:absolute;bottom:12px;width:70px;animation:drive 8s linear infinite}
.road .car svg{animation:bump .35s ease-in-out infinite alternate}
@keyframes drive{from{left:-80px}to{left:calc(100% + 20px)}}
@keyframes bump{to{transform:translateY(-2px)}}
.garland{display:flex;justify-content:center;align-items:center;gap:2px;height:100%}
.garland > div{width:40px;animation:sway 5s ease-in-out infinite;transform-origin:50% 100%}
.garland > div.big{width:62px}
.garland > div{filter:drop-shadow(0 3px 4px rgba(120,90,50,.25))}
.garland > div:nth-child(2n){animation-delay:-1.5s}
.garland > div.lf{width:62px}
@keyframes sway{50%{transform:rotate(5deg)}}
.cafe-strip{display:flex;justify-content:center;align-items:flex-end;gap:16px;height:100%}
.cafe-strip .cup{width:58px;position:relative}
.cafe-strip .steam{position:absolute;top:-6px;left:22px;width:18px;height:26px}
.cafe-strip .steam span{position:absolute;bottom:0;width:4px;height:16px;border-radius:4px;background:rgba(120,80,50,.35);filter:blur(1.5px);animation:steam 2.4s ease-in infinite}
.cafe-strip .steam span:nth-child(2){left:8px;animation-delay:.8s}
.cafe-strip .steam span:nth-child(3){left:16px;animation-delay:1.6s}
@keyframes steam{0%{opacity:0;transform:translateY(6px) scaleY(.6)}40%{opacity:1}100%{opacity:0;transform:translateY(-16px) translateX(4px) scaleY(1.3)}}
.cafe-strip .b{width:36px;animation:sway 4s ease-in-out infinite}
.hearts{display:flex;justify-content:center;align-items:center;gap:14px;height:100%}
.hearts div{width:26px;animation:beat 1.6s ease-in-out infinite}
.hearts div:nth-child(2){width:38px;animation-delay:.2s}.hearts div:nth-child(3){animation-delay:.4s}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.1)}}

/* sheets */
.wrap{position:fixed;inset:0;z-index:40;background:rgba(20,10,10,.45);opacity:0;pointer-events:none;transition:opacity .35s}
.wrap.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:26px 26px 0 0;padding:10px 20px calc(22px + var(--safe-b));transform:translateY(100%);transition:transform .5s var(--ease)}
.wrap.on .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:var(--accent2);margin:0 auto 10px}
.sheet h2{font-family:var(--serif);font-weight:700;font-size:30px;margin:0 0 12px}
.drop{display:block;border:2px dashed var(--accent2);border-radius:18px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;margin-bottom:12px}
#thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;animation:pop .4s var(--spring)}
#thumbs:not(:empty)+.drop-hint{display:block;margin-top:8px;font-size:13px}
@keyframes pop{from{transform:scale(0)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--accent2);font-size:14px;font-weight:500}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.field{width:100%;font:inherit;font-size:16px;color:var(--ink);background:color-mix(in srgb,var(--accent2) 22%,transparent);border:0;border-radius:14px;padding:13px 14px;margin-bottom:10px;outline:none}
textarea.field{min-height:84px;resize:vertical;font-family:var(--serif);font-style:italic;font-size:18px}
.lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:2px 4px 6px;display:block}
.hint{font-size:13px;color:var(--muted);margin:2px 4px 8px;display:block}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.full{width:100%}

/* viewer */
#viewer{position:fixed;inset:0;z-index:45;background:rgba(10,6,6,.94);display:none;flex-direction:column;align-items:center;justify-content:center}
#viewer.on{display:flex;animation:fade .35s}
@keyframes fade{from{opacity:0}}
.vstage{width:100%;flex:1;display:grid;place-items:center;overflow:hidden;padding:60px 14px 10px}
#vimg{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
#vimg.kb{animation:kb 8s ease-out forwards}
@keyframes kb{from{transform:scale(.92);opacity:0}12%{opacity:1}to{transform:scale(1.05)}}
.vcap{color:#f3e7d6;text-align:center;padding:10px 20px calc(24px + var(--safe-b))}
.vcap b{display:block;font-family:var(--serif);font-weight:700;font-size:26px}
.vcap span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.vx{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:20px;z-index:2}
.vp{position:absolute;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:26px;z-index:2}
.vprev{left:10px}.vnext{right:10px}
.toast{position:fixed;left:50%;bottom:calc(160px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.4s var(--ease);z-index:70;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
@media (min-width:700px){.page{padding:20px 40px}}
</style>
</head>
<body>
<canvas id="amb"></canvas>
<div id="wipe"></div>

<section id="cover">
  <div class="paper" id="paper">
    <img class="frame" src="cover.webp" alt="" fetchpriority="high">
    <div class="oval"><div class="ph-rose" id="phRose"></div><img id="coverPhoto" alt=""></div>
    <div class="cv-text">
      <h1><span id="cA"></span> <b>&amp;</b> <span id="cB"></span></h1>
      <p class="cv-date" id="cDays"></p>
      <button id="openBtn">OPEN THE ALBUM</button>
    </div>
  </div>
</section>

<main id="app" hidden>
  <header class="top">
    <button class="names" id="namesBtn"><span id="nA"></span><i>&amp;</i><span id="nB"></span></button>
    <div class="days" id="days"></div>
    <button class="icon" id="setBtn" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
  </header>
  <div class="deco" id="deco"></div>
  <div class="book" id="book"></div>
  <div class="progress"><i id="prog"></i></div>
  <nav class="tabs" id="tabs"></nav>
</main>
<button id="fab" aria-label="New memory" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="wrap" id="addWrap"><div class="sheet">
  <div class="grab"></div>
  <h2>New memory</h2>
  <label class="drop"><input type="file" id="files" accept="image/*" multiple hidden><div id="thumbs"></div><span class="drop-hint">📷 Choose photos (up to 6)</span></label>

function draw(p){
 if(p.t==='wedding'&&PETAL.complete&&PETAL.naturalWidth){const s=p.s*2.1;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.scale(1,.35+.65*Math.abs(Math.cos(p.ph*1.3)));cx.drawImage(PETAL,-s/2,-s/2,s,s);cx.restore()}
 else if(p.t==='wedding'){const s=p.s;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.scale(1,.3+.7*Math.abs(Math.cos(p.ph*1.3)));
  const g=cx.createRadialGradient(0,s*.7,0,0,0,s*1.4);g.addColorStop(0,'#eadcc6');g.addColorStop(.5,'#fbf6ee');g.addColorStop(1,'#ffffff');
  cx.fillStyle=g;cx.shadowColor='rgba(140,110,70,.25)';cx.shadowBlur=5;cx.shadowOffsetY=2;
  cx.beginPath();cx.moveTo(0,s);cx.bezierCurveTo(-s*1.15,s*.2,-s*.85,-s,0,-s*.7);cx.bezierCurveTo(s*.85,-s,s*1.15,s*.2,0,s);cx.fill();cx.restore()}
 else if(p.t==='trips'){if(p.burst){cx.fillStyle='#ffd36b';cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.283);cx.fill();return}
  const g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s);g.addColorStop(0,`rgba(${p.hue},${p.al})`);g.addColorStop(1,`rgba(${p.hue},0)`);cx.fillStyle=g;cx.beginPath();cx.arc(p.x,p.y,p.s,0,6.283);cx.fill()}
 else if(p.t==='cafe'){cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle='rgba(107,66,38,.55)';cx.beginPath();cx.ellipse(0,0,p.s,p.s*1.35,0,0,6.283);cx.fill();cx.strokeStyle='rgba(60,36,20,.6)';cx.lineWidth=1.2;cx.beginPath();cx.moveTo(0,-p.s*1.1);cx.quadraticCurveTo(p.s*.5,0,0,p.s*1.1);cx.stroke();cx.restore()}
 else{cx.save();cx.translate(p.x,p.y);cx.rotate(Math.sin(p.ph)*.3);const s=p.s/8;cx.scale(s,s);cx.fillStyle=p.burst?'rgba(212,104,126,.9)':'rgba(212,104,126,.4)';cx.beginPath();cx.moveTo(0,4);cx.bezierCurveTo(-10,-3,-4,-11,0,-5);cx.bezierCurveTo(4,-11,10,-3,0,4);cx.fill();cx.restore()}}
function loop(){requestAnimationFrame(loop);if(document.hidden)return;const W=innerWidth,H=innerHeight;cx.clearRect(0,0,W,H);
 for(let i=P.length-1;i>=0;i--){const p=P[i];
  if(p.burst){p.vy+=.2;p.vx*=.98;p.life-=.013;if(p.life<=0){P.splice(i,1);continue}cx.globalAlpha=p.life}else cx.globalAlpha=1;
  p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.ph+=.02;
  if(p.t==='wedding'&&!p.burst)p.x+=Math.sin(p.ph)*.6;
  if(!p.burst){if(p.y>H+30)p.y=-30;if(p.y<-30)p.y=H+30;if(p.x>W+80)p.x=-80;if(p.x<-80)p.x=W+80}
  draw(p)}
 cx.globalAlpha=1}

/* ================= RENDER ================= */
function rng(seed){let s=0;for(const c of seed)s=(s*31+c.charCodeAt(0))|0;return()=>{s=(s*1664525+1013904223)|0;return((s>>>0)%10000)/10000}}
function stk(name,style,r,d,w){return`<div class="stk" style="${style};width:${w}px;--r:${r}deg;--d:${d}ms">${S[name]}</div>`}
function deco(){const d=$('#deco');
 if(cur==='trips')d.innerHTML=`<div class="road"><i></i><div class="car">${S.car}</div></div>`;
 else if(cur==='wedding')d.innerHTML=`<div class="garland"><div class="lf" style="transform:scaleX(-1)">${S.leaf}</div><div>${S.bud}</div><div class="big">${S.rose}</div><div>${S.bud}</div><div class="lf">${S.leaf}</div></div>`;
 else if(cur==='cafe')d.innerHTML=`<div class="cafe-strip"><div class="b">${S.beans}</div><div class="cup"><div class="steam"><span></span><span></span><span></span></div>${S.cup}</div><div class="b" style="width:46px">${S.croissant}</div></div>`;
 else d.innerHTML=`<div class="hearts"><div>${S.heart}</div><div>${S.heart}</div><div>${S.heart}</div></div>`}
const countTxt=n=>n===1?'1 memory':`${n} memories`;
function chapterPage(n){const c=CH[cur];const p=el('section','page chap');const rs=[-6,12,-6,14];
 p.innerHTML=`<div class="leaf"><div class="chap-art">${c.art.map((s,i)=>`<div class="stk a${i}" style="--r:${rs[i]}deg;--d:${i*130}ms">${S[s]}</div>`).join('')}</div>
 <p class="kick">${c.num}</p><h2>${c.name}</h2><p class="line">${c.line}</p>
 <p class="count">${n?countTxt(n):'No memories here yet'}</p>
 ${n?'<p class="swipe">Swipe to turn the page <span>→</span></p>':'<button class="btn add1">Add the first memory</button>'}</div>`;
 const b=p.querySelector('.add1');if(b)b.onclick=openAdd;return p}
function memPage(m){const p=el('section','page');p.dataset.id=m.id;const leaf=el('div','leaf');p.appendChild(leaf);
 const col=el('div','collage');leaf.appendChild(col);const np=Math.min(3,m.n||0);const L=LAY[np]||LAY[1];
 Array.from({length:np}).forEach((_,i)=>{const s=L[i];const pol=el('button','pol');
  pol.style.cssText=`left:${s.l}%;top:${s.t}%;width:${s.w}%;height:${s.h}%;--r:${s.r}deg;--d:${i*110}ms`;
  pol.innerHTML=`<span class="tape"></span><span class="ph"><img alt=""></span>`;pol.onclick=()=>openViewer(m,i);col.appendChild(pol)});
 if((m.n||0)>3){const mo=el('button','more');mo.textContent='+'+(m.n-3);mo.onclick=()=>openViewer(m,3);col.appendChild(mo)}
 const cap=el('div','cap');const h=el('h3');h.textContent=m.title||'A lovely memory';const dt=el('div','date');dt.textContent=fmt(m.date);cap.append(h,dt);
 if(m.note){const n=el('p','note');n.textContent=m.note;cap.appendChild(n)}leaf.appendChild(cap);
 const k=el('button','kebab');k.setAttribute('aria-label','Delete');k.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
 k.onclick=async()=>{if(confirm('Delete this memory?')){try{await Cloud.del(m);mems=mems.filter(x=>x.id!==m.id);PH.delete(m.id);render(true);toast('Memory deleted')}catch(e){toast("Couldn't delete — try again")}}};leaf.appendChild(k);
 const r=rng(m.id);const pool=[...new Set(CH[m.ch].stk)].concat(CH[m.ch].stk.filter((v,i,a)=>a.indexOf(v)!==i));const spots=SPOTS.slice();const n=2+Math.floor(r()*2);let html='';
 for(let i=0;i<n;i++){const si=Math.floor(r()*pool.length),pi=Math.floor(r()*spots.length);const nm=pool.splice(si,1)[0],sp=spots.splice(pi,1)[0];
  html+=stk(nm,Object.entries(sp).map(([a,b])=>a+':'+b).join(';'),Math.round(r()*40-20),i*140,Math.round((nm==='rose'?72:56)+r()*24))}
 leaf.insertAdjacentHTML('beforeend',html);return p}
let io;
let near;
function render(keep){const bk=$('#book');const pi=keep?Math.round(Math.abs(bk.scrollLeft)/(bk.clientWidth||1)):0;
 const list=mems.filter(m=>m.ch===cur).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.created-b.created);
 const book=$('#book');book.innerHTML='';book.appendChild(chapterPage(list.length));list.forEach(m=>book.appendChild(memPage(m)));
 book.scrollLeft=Math.min(pi,book.children.length-1)*book.clientWidth;if(io)io.disconnect();if(near)near.disconnect();
 near=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.target.dataset.id)fill(e.target)}),{root:book,rootMargin:'0px 100% 0px 100%'});[...book.children].forEach(p=>near.observe(p));
 io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{root:book,threshold:.55});
 [...book.children].forEach(p=>io.observe(p));onScroll()}
let ticking=false;
function onScroll(){const b=$('#book');const w=b.clientWidth||1;const x=Math.abs(b.scrollLeft);const pages=b.children;
 for(let i=0;i<pages.length;i++){const o=Math.max(-1,Math.min(1,(i*w-x)/w));const leaf=pages[i].firstElementChild;if(!leaf||reduce)continue;
  leaf.style.transformOrigin=o>0?'left center':'right center';
  leaf.style.transform=Math.abs(o)<.001?'none':`perspective(1100px) rotateY(${(o*34).toFixed(2)}deg) scale(${(1-Math.abs(o)*.12).toFixed(3)})`;
  leaf.style.opacity=(1-Math.abs(o)*.55).toFixed(3)}
 const n=pages.length;const idx=Math.min(n-1,Math.round(x/w));$('#prog').style.width=(n>1?idx/(n-1)*100:100)+'%';ticking=false}
$('#book').addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(onScroll)}},{passive:true});

/* ================= TABS & THEME ================= */
function tabs(){const t=$('#tabs');t.innerHTML=ORDER.map(k=>`<button class="tab" data-k="${k}">${ICON[k]}<span>${CH[k].short}</span></button>`).join('')+'<span class="pill" id="pill"></span>';
 t.querySelectorAll('.tab').forEach(b=>b.onclick=e=>switchCh(b.dataset.k,e));tabsUpdate()}
function tabsUpdate(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.k===cur));const a=document.querySelector('.tab.on'),p=$('#pill');if(a&&p){p.style.width=a.offsetWidth+'px';p.style.transform=`translateX(${a.offsetLeft}px)`}}
function applyTheme(ch){cur=ch;document.documentElement.dataset.theme=ch;store.set('album.ch',ch);document.querySelector('meta[name=theme-color]').content=CH[ch].bg;tabsUpdate();deco();render();setAmbient(ch)}
function switchCh(ch,ev){if(ch===cur)return;if(reduce||!document.body.animate){applyTheme(ch);return}
 const r=ev&&ev.currentTarget?ev.currentTarget.getBoundingClientRect():null;const x=r?r.left+r.width/2:innerWidth/2,y=r?r.top+r.height/2:innerHeight;
 const R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));const w=$('#wipe');w.style.background=CH[ch].bg;w.style.opacity=1;w.style.display='block';
 const a=w.animate([{clipPath:`circle(0px at ${x}px ${y}px)`},{clipPath:`circle(${R}px at ${x}px ${y}px)`}],{duration:560,easing:'cubic-bezier(.7,0,.3,1)',fill:'forwards'});
 a.onfinish=()=>{applyTheme(ch);const b=w.animate([{opacity:1},{opacity:0}],{duration:450,easing:'ease-out',fill:'forwards'});b.onfinish=()=>{w.style.display='none';a.cancel();b.cancel()}}}

/* ================= HEADER / SETTINGS ================= */
function daysTxt(){if(!settings.since)return'';const n=Math.floor((new Date(today()+'T12:00:00')-new Date(settings.since+'T12:00:00'))/864e5);return n>=0?`${n.toLocaleString('en')} days together 🤍`:''}
function header(){$('#nA').textContent=$('#cA').textContent=settings.a;$('#nB').textContent=$('#cB').textContent=settings.b;$('#days').textContent=daysTxt();$('#cDays').textContent=settings.since?settings.since.split('-').reverse().join(' . '):'';document.title=`${settings.a} & ${settings.b} · Our Memory Book`}
function openSet(){$('#sA').value=settings.a;$('#sB').value=settings.b;$('#sSince').value=settings.since||'';$('#setWrap').classList.add('on')}
$('#setBtn').onclick=openSet;$('#namesBtn').onclick=openSet;
$('#sSave').onclick=()=>{settings={a:$('#sA').value.trim()||'Rami',b:$('#sB').value.trim()||'Fedaa',since:$('#sSince').value};store.set('album.settings.en',settings);header();close();setDoc(doc(fdb,'meta','settings'),settings).then(()=>toast('Saved'),()=>toast("Couldn't save — check your connection"))};
document.querySelectorAll('.wrap').forEach(w=>w.addEventListener('click',e=>{if(e.target===w)w.classList.remove('on')}));
const close=()=>document.querySelectorAll('.wrap').forEach(w=>w.classList.remove('on'));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}

/* ================= ADD MEMORY ================= */
let picked=[],pickCh=cur;
function chips(){$('#chips').innerHTML=ORDER.map(k=>`<button class="chip${k===pickCh?' on':''}" data-k="${k}">${CH[k].short}</button>`).join('');
 $('#chips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{pickCh=c.dataset.k;chips()})}
function openAdd(){picked=[];pickCh=cur;$('#thumbs').innerHTML='';$('#fTitle').value='';$('#fNote').value='';$('#fDate').value=today();$('#files').value='';chips();$('#addWrap').classList.add('on')}
$('#fab').onclick=openAdd;
/* resize + compress until it fits comfortably in one Firestore document */
async function shrink(file){let img;try{img=await createImageBitmap(file)}catch(e){img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
 let max=1600,q=.82;const c=document.createElement('canvas'),x=c.getContext('2d');
 for(let k=0;k<12;k++){const s=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);x.drawImage(img,0,0,c.width,c.height);
  const d=c.toDataURL('image/jpeg',q);if(d.length<880000)return d;if(q>.62)q-=.08;else max=Math.round(max*.82)}
 return c.toDataURL('image/jpeg',.5)}
$('#files').onchange=async e=>{const fs=[...e.target.files].slice(0,6-picked.length);for(const f of fs){try{const d=await shrink(f);picked.push(d);const i=el('img');i.src=d;$('#thumbs').appendChild(i)}catch(err){}}};
let saving=false;
$('#saveBtn').onclick=async()=>{if(saving)return;if(!picked.length){toast('Pick at least one photo');return}
 const m={id:uid(),ch:pickCh,title:$('#fTitle').value.trim(),date:$('#fDate').value||today(),note:$('#fNote').value.trim(),created:Date.now(),n:picked.length};
 saving=true;$('#saveBtn').textContent='Uploading…';
 try{await Cloud.put(m,picked,(i,n)=>{$('#saveBtn').textContent=`Uploading ${i}/${n}…`})}catch(e){saving=false;$('#saveBtn').textContent='Save memory';toast("Couldn't upload — check your connection");return}
 saving=false;$('#saveBtn').textContent='Save memory';PH.set(m.id,Promise.resolve(picked.slice()));
 if(!mems.find(x=>x.id===m.id))mems.push(m);close();const go=()=>{const p=document.querySelector(`.page[data-id="${m.id}"]`);if(p)p.scrollIntoView({behavior:reduce?'auto':'smooth',inline:'center'});const f=$('#fab').getBoundingClientRect();burst(f.left+29,f.top+29);toast('Memory saved ✨')};
 if(pickCh!==cur){switchCh(pickCh);setTimeout(go,1100)}else{render();setTimeout(go,250)}};

/* ================= VIEWER ================= */
let vm=null,vi=0;
async function showV(){const im=$('#vimg');const n=vm.n||0;
 $('#vt').textContent=vm.title||'A lovely memory';$('#vn').textContent=`${fmt(vm.date)} · ${vi+1} / ${n}`;
 $('#vprev').style.visibility=vi>0?'visible':'hidden';$('#vnext').style.visibility=vi<n-1?'visible':'hidden';
 const want=vi,arr=await loadPhotos(vm);if(want!==vi)return;
 im.classList.remove('kb');void im.offsetWidth;im.src=arr[vi]||'';im.classList.add('kb')}
function openViewer(m,i){vm=m;vi=i;$('#vimg').removeAttribute('src');$('#viewer').classList.add('on');showV()}
$('#vx').onclick=()=>{$('#viewer').classList.remove('on')};
$('#vprev').onclick=()=>{if(vi>0){vi--;showV()}};$('#vnext').onclick=()=>{if(vi<(vm.n||0)-1){vi++;showV()}};
let sx=0;$('#viewer').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
$('#viewer').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50){dx<0?$('#vnext').click():$('#vprev').click()}});

/* ================= BACKUP / MIGRATION ================= */
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
$('#expBtn').onclick=async()=>{toast('Preparing backup…');const out={v:2,settings,memories:[]};
 for(const m of mems)out.memories.push(Object.assign({},m,{photos:await loadPhotos(m)}));
 const a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));a.download='memory-book-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
async function uploadMany(list,label){let k=0;for(const m of list){k++;toast(`${label} ${k}/${list.length}…`);
  const photos=[];for(const p of m.photos||[]){const blob=typeof p==='string'?await fetch(p).then(r=>r.blob()):p;photos.push(await shrink(blob))}
  if(!photos.length)continue;const mm={id:m.id||uid(),ch:CH[m.ch]?m.ch:'moments',title:m.title||'',date:m.date||today(),note:m.note||'',created:m.created||Date.now(),n:photos.length};
  await Cloud.put(mm,photos);PH.set(mm.id,Promise.resolve(photos))}}
$('#impFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());close();
 await uploadMany(d.memories||[],'Restoring');toast('Memories restored ✨')}catch(err){toast('That file is not a valid backup')}};
async function checkLocal(){await DB.open();let list=[];try{list=await DB.all()||[]}catch(e){}
 const b=$('#migBtn');if(list.length&&!store.get('album.migrated',false)){b.hidden=false;b.textContent=`Upload ${list.length} ${list.length===1?'memory':'memories'} saved on this phone`;
  b.onclick=async()=>{b.disabled=true;close();try{await uploadMany(list,'Uploading');store.set('album.migrated',true);b.hidden=true;toast('All set — now shared ✨')}catch(e){toast("Couldn't upload — try again");b.disabled=false}}}}

/* ================= AUTH & SYNC ================= */
let unsub=[],opened=false,member=false;
function setCoverBtn(){$('#openBtn').textContent=auth.currentUser?'OPEN THE ALBUM':'SIGN IN WITH GOOGLE'}
async function signIn(){const p=new GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
 try{await signInWithPopup(auth,p);return true}catch(e){
  if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){await signInWithRedirect(auth,p);return false}
  if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')toast("Couldn't sign in — try again");return false}}
async function verifyMember(){try{await getDoc(doc(fdb,'meta','settings'));return true}catch(e){
  if(e.code==='permission-denied'){toast('Sorry, this album is private 🤍');await signOut(auth);return false}return true}}
function startSync(){unsub.forEach(f=>f());unsub=[];
 unsub.push(onSnapshot(collection(fdb,'memories'),snap=>{mems=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(opened)render(true)},
  e=>{if(e.code==='permission-denied'){toast('Sorry, this album is private 🤍');signOut(auth)}}));
 unsub.push(onSnapshot(doc(fdb,'meta','cover'),s=>{if(s.exists()){const d=s.data().data;setCover(d);try{localStorage.setItem('album.cover',d)}catch(e){}}},()=>{}));
 unsub.push(onSnapshot(doc(fdb,'meta','settings'),s=>{if(s.exists()){settings=Object.assign(settings,s.data());store.set('album.settings.en',settings);header()}},()=>{}))}
function openBook(){if(opened)return;opened=true;$('#cover').classList.add('open','gone');$('#app').hidden=false;$('#fab').hidden=false;tabsUpdate();setTimeout(()=>{$('#cover').style.display='none';render()},reduce?0:1200)}
function closeBook(){opened=false;$('#app').hidden=true;$('#fab').hidden=true;close();const c=$('#cover');c.style.display='';c.classList.remove('open','gone')}
$('#cover').onclick=async()=>{if(opened)return;
 if(!auth.currentUser){const ok=await signIn();if(!ok)return}
 if(!member){member=await verifyMember();if(!member)return;startSync()}
 openBook()};
$('#outBtn').onclick=async()=>{close();await signOut(auth)};
onAuthStateChanged(auth,async u=>{setCoverBtn();$('#who').textContent=u?`Signed in as ${u.email}`:'';
 if(!u){member=false;try{localStorage.removeItem('album.cover')}catch(e){}const cp=$('#coverPhoto');cp.classList.remove('ok');cp.removeAttribute('src');$('#phRose').style.display='';unsub.forEach(f=>f());unsub=[];mems=[];PH.clear();if(opened)closeBook();return}
 if(!member){member=await verifyMember();if(member){startSync();checkLocal()}}});
getRedirectResult(auth).catch(()=>{});

/* ================= COVER & BOOT ================= */
$('#phRose').innerHTML=S.rose;
function setCover(d){if(!d)return;const im=$('#coverPhoto');im.onload=()=>{im.classList.add('ok');$('#phRose').style.display='none'};im.src=d}
try{setCover(localStorage.getItem('album.cover'))}catch(e){}
$('#coverFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;close();toast('Uploading cover photo…');try{const d=await shrink(f);await setDoc(doc(fdb,'meta','cover'),{data:d});toast('Cover updated ✨')}catch(err){toast("Couldn't update the cover")}};
addEventListener('resize',()=>{size();tabsUpdate();onScroll()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
document.documentElement.dataset.theme=cur;size();header();tabs();deco();setAmbient(cur);loop();setCoverBtn();
})();
</script>
